# Retries creating a FREE Oracle Cloud Ampere A1 server (2 CPU / 12 GB, Ubuntu 24.04)
# until Oracle has capacity. Stops trying once the server exists.
#
# Needs 2 GitHub secrets (Settings > Secrets and variables > Actions):
#   OCI_CONFIG : the "Configuration file preview" text Oracle shows after you add an API key
#   OCI_KEY    : the full content of the private key file (.pem) you downloaded from Oracle
#
# Put this file at: .github/workflows/oracle-a1-retry.yml

name: Get Oracle A1 server

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay it a bit)
  workflow_dispatch:          # lets you start it manually from the Actions tab

permissions:
  contents: read
  issues: write     # to open the "server created" issue (GitHub emails you)
  actions: write    # to turn this workflow off after success

concurrency:
  group: oracle-a1
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Configure OCI
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          printf '%s\n' "$OCI_CONFIG" | grep -v '^key_file' > ~/.oci/config
          echo "key_file=$HOME/.oci/key.pem" >> ~/.oci/config
          chmod 600 ~/.oci/key.pem ~/.oci/config

      - name: Try to create the server
        id: try
        run: |
          C=$(grep '^tenancy' ~/.oci/config | head -1 | cut -d= -f2 | tr -d ' \r')
          export SUPPRESS_LABEL_WARNING=True

          # Stop if an A1 server already exists
          EXIST=$(oci compute instance list -c "$C" --query "data[?shape=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'].id | [0]" --raw-output 2>/dev/null || true)
          if [ -n "$EXIST" ] && [ "$EXIST" != "null" ]; then
            echo "SUCCESS: the A1 server already exists ($EXIST)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AD=$(oci iam availability-domain list -c "$C" --query 'data[0].name' --raw-output)
          SUBNET=$(oci network subnet list -c "$C" --all --query "data[?\"display-name\"=='public subnet-web-vcn'].id | [0]" --raw-output)
          IMG=$(oci compute image list -c "$C" --all --operating-system "Canonical Ubuntu" --operating-system-version "24.04" --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC --query "data[?!contains(\"display-name\",'Minimal')].id | [0]" --raw-output)
          echo "AD=$AD"; echo "SUBNET=$SUBNET"; echo "IMAGE=$IMG"

          echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDpIx/h0AXU/MfX+tLwEnnJwmQTYkyOPnPpONjvf5TnE github-actions-oci' > key.pub
          cat > init.sh <<'EOF'
          #!/bin/bash
          iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
          iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
          netfilter-persistent save
          apt-get update -y
          apt-get install -y git curl ca-certificates
          EOF
          sed -i 's/^ *//' init.sh

          # 3 attempts per run, 2 minutes apart
          for i in 1 2 3; do
            if OUT=$(oci --no-retry compute instance launch --availability-domain "$AD" -c "$C" \
                 --shape VM.Standard.A1.Flex --shape-config '{"ocpus":2,"memoryInGBs":12}' \
                 --image-id "$IMG" --subnet-id "$SUBNET" --assign-public-ip true \
                 --display-name web-server --ssh-authorized-keys-file key.pub \
                 --user-data-file init.sh 2>&1); then
              echo "SUCCESS: server is being created!"
              echo "$OUT" | grep -E '"id"|lifecycle-state' | head -3
              ID=$(echo "$OUT" | grep -m1 '"id"' | cut -d'"' -f4)
              echo "created=true" >> "$GITHUB_OUTPUT"
              echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$OUT" | grep -qi 'capacity'; then echo "Attempt $i: out of capacity"
            elif echo "$OUT" | grep -qi 'TooManyRequests'; then echo "Attempt $i: too many requests"
            else echo "Attempt $i: other error:"; echo "$OUT" | head -20; fi
            [ $i -lt 3 ] && sleep 120
          done
          echo "No capacity this time. Will retry on the next scheduled run."

      - name: Email me (open a GitHub issue)
        if: steps.try.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTANCE_ID: ${{ steps.try.outputs.instance_id }}
        run: |
          gh issue create --assignee "${{ github.repository_owner }}" \
            --title "Oracle server created!" \
            --body "@${{ github.repository_owner }} Your free Oracle Ampere A1 server (2 CPU / 12 GB, Ubuntu 24.04) named **web-server** is being created in Paris.

          Instance ID: \`$INSTANCE_ID\`

          Open Oracle Cloud > Compute > Instances to see its public IP (ready in ~2 minutes).
          The retry workflow has been turned off automatically."

      - name: Stop retrying
        if: steps.try.outputs.created == 'true' || steps.try.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow disable oracle-a1-retry.yml
